# Runtime environment for pyMultiFit; install the library itself afterwards with `pip install pymultifit`
# (or `pip install -e .` from a checkout). See `environment-dev.yaml` for development tools.
name: pymultifit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10
  - numpy
  - scipy
  - matplotlib
  - statsmodels
  - pip
  - pip:
      - custom-inherit
      - deprecation
      - plotez
      - types-deprecated
